name: Bug report
description: Report a reproducible defect using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit witness records, location histories, credentials, or other private data. Report security-sensitive issues through the private route in SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag where the problem occurs.
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest synthetic input and exact command that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fail-closed behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Data-safety confirmation
      options:
        - label: This report contains only synthetic data and no identifying information.
          required: true
