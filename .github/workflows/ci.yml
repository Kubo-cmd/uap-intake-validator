name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
      - name: Compile source
        env:
          PYTHONWARNINGS: error
        run: python -m compileall -q .
      - name: Run executable regression suite
        env:
          PYTHONWARNINGS: error
        run: python tests/run_tests.py
      - name: Run clean-room conditioning suite
        env:
          PYTHONWARNINGS: error
        run: python tests/test_uap_conditioning.py
      - name: Run pytest runtime and evidence lifecycle suites
        env:
          PYTHONWARNINGS: error
        run: python -m pytest -q tests/test_runtime_v0_2.py tests/test_evidence_lifecycle.py
      - name: Run frozen evidence lifecycle checks
        env:
          PYTHONWARNINGS: error
        run: |
          python evidence/test_stronger_evidence.py
          python evidence/stronger_evidence.py verify
      - name: Verify immutable frozen bundle
        run: python verify_frozen_bundle.py
